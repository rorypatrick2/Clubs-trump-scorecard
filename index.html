<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173d2d">
<title>Clubs Trump Scorecard</title>
<style>
:root{--bg:#f4f1e8;--card:#fffdf7;--ink:#17221c;--muted:#69736d;--green:#173d2d;--green2:#245e45;--gold:#d4a93b;--red:#a33a32;--line:#d9d5c9;--shadow:0 8px 24px rgba(23,61,45,.12)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#e8efe9 0,#f4f1e8 220px);min-height:100vh}.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom))}header{padding:18px 4px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-family:Georgia,serif;margin:0;color:var(--green);font-size:clamp(27px,7vw,40px);line-height:1}.club{color:var(--green2)}button,input,select{font:inherit}button{border:0;border-radius:12px;cursor:pointer;touch-action:manipulation}.icon-btn{background:rgba(255,255,255,.72);color:var(--green);padding:10px 12px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.08)}.panel{background:var(--card);border:1px solid rgba(23,61,45,.12);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.panel h2{margin:0 0 14px;font-size:20px}.field{margin:0 0 16px}.field label{display:block;font-weight:750;margin:0 0 7px}.hint{color:var(--muted);font-size:13px;line-height:1.35;margin-top:5px}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#ece9df;padding:5px;border-radius:14px}.segmented button{padding:11px 8px;background:transparent;color:var(--muted);font-weight:750}.segmented button.active{background:white;color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.08)}select,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;background:white;padding:12px;color:var(--ink)}.player-row{display:grid;grid-template-columns:1fr 44px;gap:8px;margin:8px 0}.remove{background:#f4e3e0;color:var(--red);font-weight:900;font-size:20px}.secondary{width:100%;background:#e6eee8;color:var(--green);padding:12px;font-weight:800}.primary{width:100%;background:var(--green);color:white;padding:14px;font-weight:850;font-size:17px;box-shadow:0 5px 14px rgba(23,61,45,.25)}.danger{background:#f4e3e0;color:var(--red)}.hidden{display:none!important}.round-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.round-head h2{margin:0}.round-meta{color:var(--muted);font-weight:700}.progress{height:8px;background:#e5e2d8;border-radius:99px;overflow:hidden;margin:14px 0 4px}.progress span{display:block;height:100%;background:var(--green2);transition:width .2s}.player-card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;background:white}.player-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.player-name{font-weight:850;font-size:18px}.score-pill{background:#e8efe9;color:var(--green);padding:5px 9px;border-radius:99px;font-size:13px;font-weight:800}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.control-box{background:#f5f3ec;border-radius:14px;padding:10px}.control-label{text-align:center;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px}.stepper{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:4px}.stepper button{height:42px;background:white;color:var(--green);font-size:25px;font-weight:700;border:1px solid var(--line)}.stepper output{text-align:center;font-size:26px;font-weight:900}.round-points{text-align:center;margin-top:9px;font-size:13px;color:var(--muted)}.round-points strong{color:var(--green)}.notice{padding:10px 12px;border-radius:12px;background:#fff4cf;color:#6f5611;font-size:14px;margin:10px 0}.notice.error{background:#f8dfdc;color:#7d2b25}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.action-grid .primary{grid-column:1/-1}.scoreboard{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white}.scoreboard table{border-collapse:collapse;width:100%;min-width:460px}.scoreboard th,.scoreboard td{padding:10px 8px;text-align:center;border-bottom:1px solid #ece9df}.scoreboard th:first-child,.scoreboard td:first-child{text-align:left;position:sticky;left:0;background:white}.scoreboard th{font-size:12px;color:var(--muted);background:#f6f4ee}.scoreboard .leader{font-weight:900;color:var(--green)}.winner{text-align:center;padding:20px 10px}.winner .trophy{font-size:50px}.winner h2{font-family:Georgia,serif;font-size:30px;color:var(--green);margin:7px}.footer-bar{position:fixed;z-index:10;bottom:0;left:0;right:0;background:rgba(244,241,232,.92);backdrop-filter:blur(12px);border-top:1px solid rgba(23,61,45,.12);padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;justify-content:center}.footer-inner{width:min(732px,100%);display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer-bar button{padding:12px;font-weight:800}.footer-score{background:white;color:var(--green);border:1px solid var(--line)}.footer-next{background:var(--green);color:white}.mini{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}.dealer{font-size:12px;color:var(--gold);font-weight:900}.dealer-rule{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:999px;background:#fff1c7;color:#6f5611;font-size:12px;font-weight:900}.deck-limit{margin-top:8px;padding:9px 11px;border-radius:11px;background:#e8efe9;color:var(--green);font-size:13px;font-weight:750}.made{border-color:#95bda6;background:#fbfffc}.made .round-points strong{color:#17613b}@media(max-width:420px){.panel{padding:14px}.controls{gap:7px}.control-box{padding:8px}.stepper{grid-template-columns:38px 1fr 38px}.stepper button{height:40px}.stepper output{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<header><h1><span class="club">♣</span> Clubs Trump</h1><button class="icon-btn" id="newGameTop">New game</button></header>

<section id="setup" class="panel">
<h2>Set up game</h2>
<div class="field"><label>Hand pattern</label><div class="segmented" id="patternButtons"><button data-pattern="down" class="active">Start high → 1</button><button data-pattern="updown">Go up → 1</button></div></div>
<div class="field" id="startField"><label for="startSize">Starting hand size</label><select id="startSize"></select><div class="hint">Hands decrease by one each round until the 1-card hand.</div></div>
<div class="field hidden" id="updownFields"><label>Hand sizes</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><select id="lowStart"></select><select id="peakSize"></select></div><div class="hint">Start at the first number, climb to the peak, then descend to 1. Example: 5, 6, 7, 8, 7…1.</div></div>
<div class="field"><label>Players</label><div id="playerInputs"></div><button class="secondary" id="addPlayer">+ Add player</button><div class="deck-limit" id="deckLimit"></div></div>
<button class="primary" id="startGame">Start game</button>
<div class="mini">Your current game is saved automatically on this device.</div>
</section>

<section id="game" class="hidden">
<div class="panel">
<div class="round-head"><div><h2 id="roundTitle">Round 1</h2><div class="round-meta" id="cardsLabel"></div></div><div class="round-meta" id="roundCounter"></div></div>
<div class="progress"><span id="progressBar"></span></div>
<div id="dealerNotice" class="notice"></div>
<div id="playerCards"></div>
<div id="validationNotice" class="notice hidden"></div>
<div class="action-grid"><button class="secondary" id="previousRound">← Previous</button><button class="secondary" id="resetRound">Reset round</button><button class="primary" id="completeRound">Save round & continue</button></div>
</div>
</section>

<section id="scores" class="panel hidden"><h2>Scoreboard</h2><div id="winnerBox"></div><div class="scoreboard" id="scoreTable"></div></section>
</div>

<div class="footer-bar hidden" id="footerBar"><div class="footer-inner"><button class="footer-score" id="showScores">Scoreboard</button><button class="footer-next" id="footerNext">Save & continue</button></div></div>

<script>
(()=>{
const KEY='clubsTrumpScorecard_v1';
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
let pattern='down';
let state={players:[],hands:[],round:0,entries:[],finished:false};
function fillSelect(el,min,max,selected,labeler=n=>n){el.innerHTML='';for(let n=min;n<=max;n++){let o=document.createElement('option');o.value=n;o.textContent=labeler(n);if(n===selected)o.selected=true;el.append(o)}}
function namedPlayerCount(){return $$('#playerInputs input').filter(x=>x.value.trim()).length}
function setupPlayerCount(){return Math.max(2,namedPlayerCount()||$$('#playerInputs .player-row').length)}
function maxHandForPlayers(count=setupPlayerCount()){return Math.max(1,Math.floor(52/count))}
function refillHandSelects(){
  const max=maxHandForPlayers(), startOld=+$('#startSize').value||Math.min(8,max), lowOld=+$('#lowStart').value||Math.min(5,max), peakOld=+$('#peakSize').value||Math.min(8,max);
  fillSelect($('#startSize'),1,max,Math.min(startOld,max),n=>`${n} card${n===1?'':'s'}`);
  fillSelect($('#lowStart'),1,max,Math.min(lowOld,max),n=>`Start: ${n}`);
  fillSelect($('#peakSize'),1,max,Math.min(Math.max(peakOld,1),max),n=>`Peak: ${n}`);
  const count=setupPlayerCount();
  $('#deckLimit').textContent=`With ${count} players, the largest hand is ${max} card${max===1?'':'s'} (${count} × ${max} = ${count*max} cards).`;
}

function addPlayer(name=''){const wrap=document.createElement('div');wrap.className='player-row';wrap.innerHTML=`<input type="text" maxlength="24" placeholder="Player name" value="${escapeHtml(name)}"><button class="remove" aria-label="Remove player">×</button>`;wrap.querySelector('input').addEventListener('input',refillHandSelects);wrap.querySelector('.remove').onclick=()=>{if($$('#playerInputs .player-row').length>2){wrap.remove();refillHandSelects()}};$('#playerInputs').append(wrap);refillHandSelects()}
function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
addPlayer();addPlayer();addPlayer();addPlayer();
$('#addPlayer').onclick=()=>addPlayer();
refillHandSelects();
$('#patternButtons').onclick=e=>{if(!e.target.dataset.pattern)return;pattern=e.target.dataset.pattern;$$('#patternButtons button').forEach(b=>b.classList.toggle('active',b.dataset.pattern===pattern));$('#startField').classList.toggle('hidden',pattern!=='down');$('#updownFields').classList.toggle('hidden',pattern!=='updown')};
function buildHands(){if(pattern==='down'){let s=+$('#startSize').value;return Array.from({length:s},(_,i)=>s-i)}let start=+$('#lowStart').value,peak=+$('#peakSize').value;if(start>peak)[start,peak]=[peak,start];let h=[];for(let n=start;n<=peak;n++)h.push(n);for(let n=peak-1;n>=1;n--)h.push(n);return h}
function startGame(){let players=$$('#playerInputs input').map(x=>x.value.trim()).filter(Boolean);if(players.length<2){alert('Enter at least two player names.');return}const max=maxHandForPlayers(players.length);let hands=buildHands();if(Math.max(...hands)>max){refillHandSelects();alert(`With ${players.length} players, the largest possible hand is ${max}. The hand-size choices have been adjusted.`);return}state={players,hands,round:0,entries:[],finished:false};state.entries=state.hands.map(()=>players.map(()=>({bid:0,won:0,complete:false})));save();renderGame()}
function score(e){return e.won+(e.bid===e.won?10:0)}
function totals(){return state.players.map((_,pi)=>state.entries.reduce((sum,row)=>sum+(row[pi].complete?score(row[pi]):0),0))}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function renderGame(){if(!state.players.length)return;$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');$('#scores').classList.add('hidden');$('#footerBar').classList.remove('hidden');let r=state.round,hand=state.hands[r],entry=state.entries[r],dealer=r%state.players.length;$('#roundTitle').textContent=`Round ${r+1}`;$('#cardsLabel').textContent=`${hand} card${hand===1?'':'s'} each`;$('#roundCounter').textContent=`${r+1} of ${state.hands.length}`;$('#progressBar').style.width=`${((r+1)/state.hands.length)*100}%`;$('#dealerNotice').innerHTML=`<strong>${escapeHtml(state.players[dealer])}</strong> deals and bids last. Total bids cannot equal <strong>${hand}</strong>.`;let t=totals();$('#playerCards').innerHTML='';state.players.forEach((name,pi)=>{let e=entry[pi],card=document.createElement('div'),otherBids=entry.reduce((sum,x,i)=>sum+(i===dealer?0:x.bid),0),forbidden=hand-otherBids,dealerRule=forbidden>=0&&forbidden<=hand?`<span class="dealer-rule">CAN’T BID ${forbidden}</span>`:`<span class="dealer-rule">ANY BID OK</span>`;card.className='player-card'+(e.bid===e.won?' made':'');card.innerHTML=`<div class="player-top"><div><span class="player-name">${escapeHtml(name)}</span>${pi===dealer?' <span class="dealer">DEALER</span> '+dealerRule:''}</div><span class="score-pill">Total ${t[pi]}</span></div><div class="controls"><div class="control-box"><div class="control-label">BID</div><div class="stepper"><button data-kind="bid" data-delta="-1">−</button><output>${e.bid}</output><button data-kind="bid" data-delta="1">+</button></div></div><div class="control-box"><div class="control-label">TRICKS WON</div><div class="stepper"><button data-kind="won" data-delta="-1">−</button><output>${e.won}</output><button data-kind="won" data-delta="1">+</button></div></div></div><div class="round-points">Round points: <strong>${score(e)}</strong>${e.bid===e.won?' · bid made':''}</div>`;card.querySelectorAll('.stepper button').forEach(b=>b.onclick=()=>change(pi,b.dataset.kind,+b.dataset.delta));$('#playerCards').append(card)});validate();$('#previousRound').disabled=r===0;$('#completeRound').textContent=r===state.hands.length-1?'Finish game':'Save round & continue';$('#footerNext').textContent=r===state.hands.length-1?'Finish game':'Save & continue'}
function change(pi,kind,delta){let e=state.entries[state.round][pi],max=state.hands[state.round];e[kind]=Math.max(0,Math.min(max,e[kind]+delta));save();renderGame()}
function validate(){let hand=state.hands[state.round],row=state.entries[state.round],won=row.reduce((s,e)=>s+e.won,0),bids=row.reduce((s,e)=>s+e.bid,0),box=$('#validationNotice');let msgs=[];if(won!==hand)msgs.push(`Tricks won total ${won}; it must total ${hand}.`);if(bids===hand)msgs.push(`Bids total ${hand}; the dealer must choose a different bid.`);box.classList.toggle('hidden',!msgs.length);box.classList.toggle('error',won!==hand);box.textContent=msgs.join(' ');return won===hand&&bids!==hand}
function completeRound(){if(!validate()){navigator.vibrate?.(80);return}state.entries[state.round].forEach(e=>e.complete=true);if(state.round===state.hands.length-1){state.finished=true;save();showScores(true)}else{state.round++;save();renderGame();scrollTo({top:0,behavior:'smooth'})}}
function previous(){if(state.round>0){state.round--;save();renderGame();scrollTo({top:0,behavior:'smooth'})}}
function resetRound(){state.entries[state.round]=state.players.map(()=>({bid:0,won:0,complete:false}));save();renderGame()}
function showScores(final=false){$('#game').classList.add('hidden');$('#scores').classList.remove('hidden');$('#footerBar').classList.add('hidden');let t=totals(),max=Math.max(...t),leaders=t.map((v,i)=>v===max?i:-1).filter(i=>i>=0);$('#winnerBox').innerHTML=final?`<div class="winner"><div class="trophy">🏆</div><h2>${leaders.map(i=>escapeHtml(state.players[i])).join(' & ')}</h2><div>${leaders.length>1?'Tie game':'wins'} with ${max} points</div></div>`:'';let html='<table><thead><tr><th>Player</th><th>Total</th>';state.hands.forEach((h,i)=>html+=`<th>R${i+1}<br>${h}c</th>`);html+='</tr></thead><tbody>';state.players.forEach((p,pi)=>{html+=`<tr><td class="${t[pi]===max?'leader':''}">${escapeHtml(p)}</td><td class="${t[pi]===max?'leader':''}">${t[pi]}</td>`;state.entries.forEach(row=>{let e=row[pi];html+=`<td>${e.complete?`${e.bid}/${e.won}<br><strong>${score(e)}</strong>`:'—'}</td>`});html+='</tr>'});html+='</tbody></table>';$('#scoreTable').innerHTML=html;if(!final){let back=document.createElement('button');back.className='primary';back.style.marginTop='14px';back.textContent='Back to current round';back.onclick=renderGame;$('#scoreTable').append(back)}else{let again=document.createElement('button');again.className='primary';again.style.marginTop='14px';again.textContent='Play again with same players';again.onclick=()=>{state={players:[...state.players],hands:[...state.hands],round:0,entries:state.hands.map(()=>state.players.map(()=>({bid:0,won:0,complete:false}))),finished:false};save();renderGame()};$('#scoreTable').append(again)}}
function newGame(){if(state.players.length&&!confirm('Start a new game? The current game will be erased.'))return;localStorage.removeItem(KEY);location.reload()}
$('#startGame').onclick=startGame;$('#completeRound').onclick=completeRound;$('#footerNext').onclick=completeRound;$('#previousRound').onclick=previous;$('#resetRound').onclick=resetRound;$('#showScores').onclick=()=>showScores(false);$('#newGameTop').onclick=newGame;
const old=localStorage.getItem(KEY);if(old){try{let parsed=JSON.parse(old);if(parsed.players?.length){state=parsed;if(state.finished)showScores(true);else renderGame()}}catch(e){}}
})();
</script>
</body>
</html>
